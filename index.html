<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TourSphere — Agency Administration System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=6">
<link rel="icon" type="image/png" href="favicon.png?v=2">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>

<div class="login-wrap" id="loginScreen">
  <div class="login-panel">
    <div class="login-brand">
      <div class="mark">T</div>
      <h1>TourSphere</h1>
      <p class="tag">TOUR &amp; TRAVEL ADMIN SYSTEM</p>
    </div>
    <div class="login-box">
      <h2>Staff Sign In</h2>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="field"><label>Email</label><input type="email" id="login_email" required placeholder="you@toursphere.ph" autocomplete="username"></div>
        
<div class="field">
  <label for="login_password">Password</label>

  <div style="display:flex;align-items:center;gap:8px;">
    <input type="password" id="login_password"
           required placeholder="••••••••"
           autocomplete="current-password"
           style="flex:1;min-width:0;">

    <button type="button"
            class="btn btn-ghost"
            aria-label="Show password"
            aria-pressed="false"
            onclick="togglePasswordVisibility('login_password', this)">
      👁️
    </button>
  </div>
</div>

        <button class="btn" type="submit" style="width:100%;">Sign in</button>
      </form>
      <p class="login-error" id="loginError"></p>
    </div>
  </div>
</div>

<div class="app" id="appRoot" style="display:none;">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="crumb" id="crumb">Dashboard</div>
      <div class="top-right">
        <button class="btn btn-sm" onclick="openScanner()">📷 Scan QR</button>
        <div class="bell-wrap" id="bellWrap">
          <div class="bell" onclick="toggleBell(event)">🔔<span class="dot" id="alertCount">0</span></div>
          <div class="bell-dropdown" id="bellDropdown"></div>
        </div>
        <div class="user-chip" id="userChip"></div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="scan-overlay" id="scanOverlay">
  <div class="scan-panel">
    <div class="scan-head">
      <h3 id="scanTitle">Scan a TourSphere QR</h3>
      <button class="btn-ghost btn-sm" onclick="closeScanner()">✕ Close</button>
    </div>
    <div id="scanCameraWrap">
      <video id="scanVideo" playsinline autoplay muted></video>
      <div class="scan-frame"></div>
    </div>
    <canvas id="scanCanvas" style="display:none;"></canvas>
    <p id="scanHint" class="scan-hint">Point your camera at a TourSphere QR code — facility pass, visitor pass, document tag, or contract.</p>
    <div id="scanResult"></div>
  </div>
</div>

<script src="app.js?v=9"></script>
</body>
</html>
